[package]
name = "chip8-engine"
version = "1.0.0"
edition = "2024"
description = "A deterministic, platform-independent CHIP-8 emulator"
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:js-sys", "dep:wasm-bindgen"]

[dependencies]
js-sys = { version = "0.3.104", optional = true }
wasm-bindgen = { version = "0.2.127", optional = true }
