version: '3'

vars:
  ROM_DIR: .cache/roms
  CORAX89_ROM: '{{.ROM_DIR}}/corax89-test_opcode.ch8'
  CORAX89_URL: https://raw.githubusercontent.com/corax89/chip8-test-rom/master/test_opcode.ch8
  CORAX89_SHA256: 67759cf9f5b27db66f0769ea8fd0b30ba220f46d6f19f8ba4fd4108d986ce0ab
  HELLOWORLD_ROM: '{{.ROM_DIR}}/hello-world.ch8'
  HELLOWORLD_URL: https://github.com/Timendus/chip8-test-suite/raw/main/bin/1-chip8-logo.ch8
  HELLOWORLD_SHA256: 15f7fb887ea4cb8e40615bb20b0cfd993ef55ca84c535c8c8f3fafa8bf129724
  FLAGS_ROM: '{{.ROM_DIR}}/flags-test.ch8'
  FLAGS_URL: https://github.com/Timendus/chip8-test-suite/raw/main/bin/4-flags.ch8
  FLAGS_SHA256: f00ddadd37bc878473de0c8f16faecf9985dea39036a3a796d551bc9fec47cfa
  SPACEINVADERS_ROM: '{{.ROM_DIR}}/space-invaders.ch8'
  SPACEINVADERS_URL: https://raw.githubusercontent.com/kripod/chip8-roms/master/games/Space%20Invaders%20%5BDavid%20Winter%5D.ch8
  SPACEINVADERS_SHA256: 00bb7001de52b562d98357d33375406c6d0308466d7d95c2580537d2451a75cd
  SUPERCHIP_ROM: '{{.ROM_DIR}}/superchip-scrolling.ch8'
  SUPERCHIP_URL: https://github.com/Timendus/chip8-test-suite/raw/main/bin/8-scrolling.ch8
  SUPERCHIP_SHA256: 3f43507c45a949e5b014445853205dd1f36bb532cf25baa22209b7c300c596d7
  XOCHIP_ROM: '{{.ROM_DIR}}/xochip-scrolling.ch8'
  XOCHIP_URL: https://github.com/Timendus/chip8-test-suite/raw/main/bin/8-scrolling.ch8
  XOCHIP_SHA256: 3f43507c45a949e5b014445853205dd1f36bb532cf25baa22209b7c300c596d7
  MURDER_SOURCE: '{{.ROM_DIR}}/murder.8o'
  MURDER_ROM: '{{.ROM_DIR}}/murder.ch8'
  MURDER_URL: https://raw.githubusercontent.com/JohnEarnest/Octo/gh-pages/examples/murder.8o
  MURDER_SHA256: 23a4562d206909cadc01d6293f0d769aa5139c63531bb75b87c9387e555e50b0
  SAFECRACKER_SOURCE: '{{.ROM_DIR}}/safecracker.8o'
  SAFECRACKER_ROM: '{{.ROM_DIR}}/safecracker.ch8'
  SAFECRACKER_SOURCE_URL: https://raw.githubusercontent.com/pushfoo/Octo-Safecracker/main/main.8o
  SAFECRACKER_SOURCE_SHA256: cc7f572bed5157d103625da77d882e040253235e7d5b5ee12e4266335ff3cdd1
  ALIEN_INV8SION_SOURCE: '{{.ROM_DIR}}/alien-inv8sion.8o'
  ALIEN_INV8SION_ROM: '{{.ROM_DIR}}/alien-inv8sion.ch8'
  ALIEN_INV8SION_SOURCE_URL: https://raw.githubusercontent.com/Timendus/alien-inv8sion/main/bin/alien-inv8sion-octo.8o
  ALIEN_INV8SION_SOURCE_SHA256: c08f0322764a99965d9cd2764aeb4ccbbb6232607c8fa38375e973fb60063459
  T8NKS_ROM: '{{.ROM_DIR}}/t8nks.ch8'
  T8NKS_URL: https://johnearnest.github.io/chip8Archive/roms/t8nks.ch8
  T8NKS_SHA256: 778e9e4794bc9126b4d15dad4d9875c2b2616413bd40d3f4612a136e40a82a1a

tasks:
  download-conformance-rom:
    desc: Download and verify corax89's public CHIP-8 opcode conformance ROM
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.CORAX89_ROM}} {{.CORAX89_URL}}
      - 'printf "%s  %s\\n" "{{.CORAX89_SHA256}}" "{{.CORAX89_ROM}}" | shasum -a 256 --check'

  download-helloworld-rom:
    desc: Download and verify hello-world ROM (Maze demo)
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.HELLOWORLD_ROM}} {{.HELLOWORLD_URL}}
      - 'printf "%s  %s\\n" "{{.HELLOWORLD_SHA256}}" "{{.HELLOWORLD_ROM}}" | shasum -a 256 --check'

  test-conformance:
    desc: Verify complete ROM loading and execute the corax89 opcode ROM
    deps: [download-conformance-rom]
    cmds:
      - CHIP8_CONFORMANCE_ROM={{.ROOT_DIR}}/{{.CORAX89_ROM}} cargo test --manifest-path src/chip8-engine/Cargo.toml --test corax89_opcode -- --nocapture

  download-flags-rom:
    desc: Download and verify flags test ROM (interactive test suite)
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.FLAGS_ROM}} {{.FLAGS_URL}}
      - 'printf "%s  %s\\n" "{{.FLAGS_SHA256}}" "{{.FLAGS_ROM}}" | shasum -a 256 --check'

  test-helloworld-gui:
    desc: Launch hello-world ROM in native GUI
    deps: [download-helloworld-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- {{.ROOT_DIR}}/{{.HELLOWORLD_ROM}}

  debug-helloworld:
    desc: Launch hello-world ROM in native GUI debug mode
    deps: [download-helloworld-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode {{.ROOT_DIR}}/{{.HELLOWORLD_ROM}}

  test-flags-gui:
    desc: Launch interactive flags test ROM in native GUI
    deps: [download-flags-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- {{.ROOT_DIR}}/{{.FLAGS_ROM}}

  debug-flags:
    desc: Launch interactive flags test ROM in native GUI debug mode
    deps: [download-flags-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode {{.ROOT_DIR}}/{{.FLAGS_ROM}}

  download-spaceinvaders-rom:
    desc: Download and verify Space Invaders ROM
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.SPACEINVADERS_ROM}} {{.SPACEINVADERS_URL}}
      - 'printf "%s  %s\\n" "{{.SPACEINVADERS_SHA256}}" "{{.SPACEINVADERS_ROM}}" | shasum -a 256 --check'

  debug-conformance:
    desc: Launch corax89 conformance ROM in native GUI debug mode
    deps: [download-conformance-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode {{.ROOT_DIR}}/{{.CORAX89_ROM}}

  play-spaceinvaders:
    desc: Launch Space Invaders in native GUI
    deps: [download-spaceinvaders-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- {{.ROOT_DIR}}/{{.SPACEINVADERS_ROM}}

  debug-spaceinvaders:
    desc: Launch Space Invaders in native GUI debug mode
    deps: [download-spaceinvaders-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode {{.ROOT_DIR}}/{{.SPACEINVADERS_ROM}}

  download-superchip-rom:
    desc: Download and verify Timendus' Super-CHIP scrolling ROM
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.SUPERCHIP_ROM}} {{.SUPERCHIP_URL}}
      - 'printf "%s  %s\\n" "{{.SUPERCHIP_SHA256}}" "{{.SUPERCHIP_ROM}}" | shasum -a 256 --check'

  play-superchip:
    desc: Launch the Super-CHIP scrolling ROM in native GUI
    deps: [download-superchip-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --profile superchip {{.ROOT_DIR}}/{{.SUPERCHIP_ROM}}

  debug-superchip:
    desc: Launch the Super-CHIP scrolling ROM in native GUI debug mode
    deps: [download-superchip-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode --profile superchip {{.ROOT_DIR}}/{{.SUPERCHIP_ROM}}

  download-xochip-rom:
    desc: Download and verify Timendus' XO-CHIP scrolling ROM
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.XOCHIP_ROM}} {{.XOCHIP_URL}}
      - 'printf "%s  %s\\n" "{{.XOCHIP_SHA256}}" "{{.XOCHIP_ROM}}" | shasum -a 256 --check'

  play-xochip:
    desc: Launch the XO-CHIP scrolling ROM in native GUI
    deps: [download-xochip-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --profile xochip {{.ROOT_DIR}}/{{.XOCHIP_ROM}}

  debug-xochip:
    desc: Launch the XO-CHIP scrolling ROM in native GUI debug mode
    deps: [download-xochip-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode --profile xochip {{.ROOT_DIR}}/{{.XOCHIP_ROM}}

  download-murder-source:
    desc: Download and verify Octo's Murder XO-CHIP two-bitplane demo source
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.MURDER_SOURCE}} {{.MURDER_URL}}
      - 'printf "%s  %s\\n" "{{.MURDER_SHA256}}" "{{.MURDER_SOURCE}}" | shasum -a 256 --check'

  compile-murder-xochip-docker:
    desc: Compile the Murder XO-CHIP demo with the official Octo compiler in Docker
    deps: [download-murder-source]
    cmds:
      - >-
        docker run --rm
        --volume "{{.ROOT_DIR}}:/workspace"
        --workdir /workspace
        node:22-alpine
        sh -ec 'apk add --no-cache curl; curl --fail --location --retry 3 --output /tmp/compiler.js https://raw.githubusercontent.com/JohnEarnest/Octo/gh-pages/js/compiler.js; node -e "const fs = require(\"fs\"); const { Compiler } = require(\"/tmp/compiler.js\"); const source = fs.readFileSync(process.argv[1], \"utf8\"); const compiler = new Compiler(source); compiler.go(); fs.writeFileSync(process.argv[2], Buffer.from(compiler.rom));" "{{.MURDER_SOURCE}}" "{{.MURDER_ROM}}"'

  download-murder-rom:
    desc: Download and compile Octo's Murder XO-CHIP two-bitplane demo in Docker
    deps: [compile-murder-xochip-docker]

  play-murder-docker:
    desc: Compile Murder in Docker, then launch it with XO-CHIP colour planes and native audio
    deps: [compile-murder-xochip-docker]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --profile xochip {{.ROOT_DIR}}/{{.MURDER_ROM}}

  play-murder:
    desc: Alias for play-murder-docker
    deps: [play-murder-docker]

  debug-murder-docker:
    desc: Compile Murder in Docker, then launch it in XO-CHIP debug mode
    deps: [compile-murder-xochip-docker]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode --profile xochip {{.ROOT_DIR}}/{{.MURDER_ROM}}

  debug-murder:
    desc: Alias for debug-murder-docker
    deps: [debug-murder-docker]

  download-safecracker-source:
    desc: Download and verify the Safecracker XO-CHIP colour-and-sound Octo source
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.SAFECRACKER_SOURCE}} {{.SAFECRACKER_SOURCE_URL}}
      - 'printf "%s  %s\\n" "{{.SAFECRACKER_SOURCE_SHA256}}" "{{.SAFECRACKER_SOURCE}}" | shasum -a 256 --check'

  compile-safecracker-xochip-docker:
    desc: Compile the Safecracker XO-CHIP colour-and-sound game with Octo in Docker
    deps: [download-safecracker-source]
    cmds:
      - >-
        docker run --rm
        --volume "{{.ROOT_DIR}}:/workspace"
        --workdir /workspace
        node:22-alpine
        sh -ec 'apk add --no-cache curl; curl --fail --location --retry 3 --output /tmp/compiler.js https://raw.githubusercontent.com/JohnEarnest/Octo/gh-pages/js/compiler.js; node -e "const fs = require(\"fs\"); const { Compiler } = require(\"/tmp/compiler.js\"); const source = fs.readFileSync(process.argv[1], \"utf8\"); const compiler = new Compiler(source); compiler.go(); fs.writeFileSync(process.argv[2], Buffer.from(compiler.rom));" "{{.SAFECRACKER_SOURCE}}" "{{.SAFECRACKER_ROM}}"'

  download-safecracker-rom:
    desc: Download and compile the Safecracker XO-CHIP colour-and-sound game in Docker
    deps: [compile-safecracker-xochip-docker]

  play-safecracker:
    desc: Compile Safecracker in Docker, then launch it with XO-CHIP colour planes and native sound
    deps: [compile-safecracker-xochip-docker]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --profile xochip {{.ROOT_DIR}}/{{.SAFECRACKER_ROM}}

  debug-safecracker:
    desc: Compile Safecracker in Docker, then launch it in XO-CHIP debug mode
    deps: [compile-safecracker-xochip-docker]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode --profile xochip {{.ROOT_DIR}}/{{.SAFECRACKER_ROM}}

  download-alien-inv8sion-source:
    desc: Download and verify the Alien Inv8sion XO-CHIP Octo-compatible source
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.ALIEN_INV8SION_SOURCE}} {{.ALIEN_INV8SION_SOURCE_URL}}
      - 'printf "%s  %s\\n" "{{.ALIEN_INV8SION_SOURCE_SHA256}}" "{{.ALIEN_INV8SION_SOURCE}}" | shasum -a 256 --check'

  compile-alien-inv8sion-docker:
    desc: Compile the Alien Inv8sion XO-CHIP shooter with Octo in Docker
    deps: [download-alien-inv8sion-source]
    cmds:
      - >-
        docker run --rm
        --volume "{{.ROOT_DIR}}:/workspace"
        --workdir /workspace
        node:22-alpine
        sh -ec 'apk add --no-cache curl; curl --fail --location --retry 3 --output /tmp/compiler.js https://raw.githubusercontent.com/JohnEarnest/Octo/gh-pages/js/compiler.js; node -e "const fs = require(\"fs\"); const { Compiler } = require(\"/tmp/compiler.js\"); const source = fs.readFileSync(process.argv[1], \"utf8\"); const compiler = new Compiler(source); compiler.go(); fs.writeFileSync(process.argv[2], Buffer.from(compiler.rom));" "{{.ALIEN_INV8SION_SOURCE}}" "{{.ALIEN_INV8SION_ROM}}"'

  play-alien-inv8sion:
    desc: Compile Alien Inv8sion in Docker, then launch it with the XO-CHIP profile
    deps: [compile-alien-inv8sion-docker]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --profile xochip {{.ROOT_DIR}}/{{.ALIEN_INV8SION_ROM}}

  debug-alien-inv8sion:
    desc: Compile Alien Inv8sion in Docker, then launch it in XO-CHIP debug mode
    deps: [compile-alien-inv8sion-docker]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode --profile xochip {{.ROOT_DIR}}/{{.ALIEN_INV8SION_ROM}}

  download-t8nks-rom:
    desc: Download and verify the official T8NKS XO-CHIP artillery game ROM
    cmds:
      - mkdir -p {{.ROM_DIR}}
      - curl --fail --location --retry 3 --output {{.T8NKS_ROM}} {{.T8NKS_URL}}
      - 'printf "%s  %s\\n" "{{.T8NKS_SHA256}}" "{{.T8NKS_ROM}}" | shasum -a 256 --check'

  play-t8nks:
    desc: Launch the T8NKS XO-CHIP artillery game
    deps: [download-t8nks-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --profile xochip --palette '#87CEEB,#554422,#456543,#EEEEFF' {{.ROOT_DIR}}/{{.T8NKS_ROM}}

  debug-t8nks:
    desc: Launch T8NKS in XO-CHIP debug mode
    deps: [download-t8nks-rom]
    cmds:
      - cargo run --manifest-path src/chip8-native-gui/Cargo.toml -- --debug-mode --profile xochip --palette '#87CEEB,#554422,#456543,#EEEEFF' {{.ROOT_DIR}}/{{.T8NKS_ROM}}
